  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      if ("serviceWorker" in navigator) {
        if (import.meta.env.DEV) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            if (registrations.length === 0) {
              sessionStorage.removeItem("fueliq-dev-sw-cleaned");
              return;
            }
            Promise.all(registrations.map(function (registration) {
              return registration.unregister();
            })).then(function () {
              return caches.keys().then(function (cacheNames) {
                return Promise.all(cacheNames
                  .filter(function (name) { return name.startsWith("fueliq-"); })
                  .map(function (name) { return caches.delete(name); }));
              });
            }).then(function () {
              if (sessionStorage.getItem("fueliq-dev-sw-cleaned")) return;
              sessionStorage.setItem("fueliq-dev-sw-cleaned", "1");
              window.location.reload();
            });
          });
        } else {
          window.addEventListener("load", function () {
            navigator.serviceWorker
              .register("/sw.js", { scope: "/" })
              .then(function (reg) {
                console.log("[SW] Registered:", reg.scope);
              })
              .catch(function (err) {
                console.log("[SW] Registration failed:", err);
              });
          });
        }
      }
    </script>
  </body>
